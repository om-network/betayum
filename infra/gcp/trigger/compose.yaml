name: betayum-trigger

x-logging: &logging
  driver: local
  options:
    max-size: 20m
    max-file: "5"
    compress: "true"

services:
  webapp:
    image: ghcr.io/triggerdotdev/trigger.dev:v4.5.9@sha256:c7c1b9842df511b5da56146ce4b7e887653bf6cc1bf4a5e16063cc4ca2c2277e
    restart: unless-stopped
    logging: *logging
    user: root
    command: sh -c "chown -R node:node /home/node/shared && exec ./scripts/entrypoint.sh"
    ports:
      - 8030:3000
    depends_on:
      - postgres
      - redis
      - clickhouse
      - minio
    networks:
      - webapp
      - supervisor
    volumes:
      - shared:/home/node/shared
    environment:
      APP_ORIGIN: ${TRIGGER_ORIGIN}
      LOGIN_ORIGIN: ${TRIGGER_ORIGIN}
      API_ORIGIN: ${TRIGGER_ORIGIN}
      ELECTRIC_ORIGIN: http://electric:3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/main?schema=public&sslmode=disable
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/main?schema=public&sslmode=disable
      SESSION_SECRET: ${SESSION_SECRET}
      MAGIC_LINK_SECRET: ${MAGIC_LINK_SECRET}
      EMAIL_TRANSPORT: resend
      FROM_EMAIL: hello@betayum.com
      REPLY_TO_EMAIL: hello@betayum.com
      RESEND_API_KEY: ${RESEND_API_KEY}
      ENCRYPTION_KEY: ${TRIGGER_ENCRYPTION_KEY}
      PROVIDER_SECRET: ${PROVIDER_SECRET}
      COORDINATOR_SECRET: ${COORDINATOR_SECRET}
      MANAGED_WORKER_SECRET: ${MANAGED_WORKER_SECRET}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_TLS_DISABLED: "true"
      DEV_OTEL_EXPORTER_OTLP_ENDPOINT: ${TRIGGER_ORIGIN}/otel
      DEPLOY_REGISTRY_HOST: ${DOCKER_REGISTRY_URL}
      DEPLOY_REGISTRY_NAMESPACE: trigger
      DEPLOY_REGISTRY_USERNAME: registry-user
      DEPLOY_REGISTRY_PASSWORD: ${DOCKER_REGISTRY_PASSWORD}
      OBJECT_STORE_BASE_URL: http://minio:9000
      OBJECT_STORE_ACCESS_KEY_ID: trigger
      OBJECT_STORE_SECRET_ACCESS_KEY: ${OBJECT_STORE_SECRET_ACCESS_KEY}
      REALTIME_STREAMS_DEFAULT_VERSION: v1
      NODE_MAX_OLD_SPACE_SIZE: 3072
      TRIGGER_BOOTSTRAP_ENABLED: 1
      TRIGGER_BOOTSTRAP_WORKER_GROUP_NAME: bootstrap
      TRIGGER_BOOTSTRAP_WORKER_TOKEN_PATH: /home/node/shared/worker_token
      CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD}@clickhouse:8123?secure=false
      RUN_REPLICATION_ENABLED: 1
      RUN_REPLICATION_CLICKHOUSE_URL: http://default:${CLICKHOUSE_PASSWORD}@clickhouse:8123
      DEFAULT_ENV_EXECUTION_CONCURRENCY_LIMIT: 10
      DEFAULT_ORG_EXECUTION_CONCURRENCY_LIMIT: 30
      TRIGGER_TELEMETRY_DISABLED: 1
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - http.get('http://localhost:3000/healthcheck',res=>process.exit(res.statusCode===200?0:1)).on('error',()=>process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:14-alpine@sha256:727876d274666da0b92a445390ba093c84b8e9f8343e1c53cd4e9a7ab2d85310
    restart: unless-stopped
    logging: *logging
    command: ["-c", "wal_level=logical"]
    networks: [webapp]
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: main
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "main"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf
    restart: unless-stopped
    logging: *logging
    networks: [webapp]
    volumes:
      - redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  cloud-sql-proxy:
    image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.18.2@sha256:fc224915ef435afeb5b2a9421260a0d31986d5c8b7c7f5783c7f5d5885700cd2
    restart: unless-stopped
    logging: *logging
    command: ["--address=0.0.0.0", "--port=5432", "${CLOUD_SQL_INSTANCE}"]
    networks: [webapp]

  electric:
    image: electricsql/electric:1.2.4@sha256:20da3d0b0e74926c5623392db67fd56698b9e374c4aeb6cb5cadeb8fea171c36
    restart: unless-stopped
    logging: *logging
    depends_on: [postgres]
    networks: [webapp]
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/main?schema=public&sslmode=disable
      ELECTRIC_INSECURE: "true"
      ELECTRIC_USAGE_REPORTING: "false"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  clickhouse:
    image: clickhouse/clickhouse-server:26.2@sha256:c2f2605585899d5103a0447daadbc0005f362200d5f0fcca7f40db3ca0dd36dd
    restart: unless-stopped
    logging: *logging
    networks: [webapp]
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes:
      - clickhouse:/var/lib/clickhouse
      - ./clickhouse/data-paths.xml:/etc/clickhouse-server/config.d/data-paths.xml:ro
      - ./clickhouse/override.xml:/etc/clickhouse-server/config.d/override.xml:ro
      - ./clickhouse/users-override.xml:/etc/clickhouse-server/users.d/override.xml:ro
    healthcheck:
      test: ["CMD", "clickhouse-client", "--password", "${CLICKHOUSE_PASSWORD}", "--query", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    logging: *logging
    entrypoint: /bin/sh
    command: -c "mkdir -p /data/packets && exec minio server /data --console-address :9001"
    networks: [webapp]
    volumes:
      - minio:/data
    environment:
      MINIO_ROOT_USER: trigger
      MINIO_ROOT_PASSWORD: ${OBJECT_STORE_SECRET_ACCESS_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10

  registry:
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    restart: unless-stopped
    logging: *logging
    ports:
      - 5000:5000
    networks: [webapp]
    volumes:
      - registry:/var/lib/registry
      - ./registry/auth.htpasswd:/auth/htpasswd:ro
    environment:
      REGISTRY_AUTH: htpasswd
      REGISTRY_AUTH_HTPASSWD_REALM: Registry Realm
      REGISTRY_AUTH_HTPASSWD_PATH: /auth/htpasswd

  supervisor:
    image: ghcr.io/triggerdotdev/supervisor:v4.5.9@sha256:f161a47daf24bb3f428d2b2bfc99ebe45119ab3f3fe9341785c6da7602eaa7c7
    restart: unless-stopped
    logging: *logging
    user: root
    command: sh -c "chown -R node:node /home/node/shared && exec /usr/bin/dumb-init -- pnpm run --filter supervisor start"
    depends_on: [webapp, docker-proxy]
    networks:
      - webapp
      - supervisor
      - docker-proxy
    volumes:
      - shared:/home/node/shared
    environment:
      TRIGGER_WORKER_TOKEN: file:///home/node/shared/worker_token
      MANAGED_WORKER_SECRET: ${MANAGED_WORKER_SECRET}
      TRIGGER_API_URL: http://webapp:3000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://webapp:3000/otel
      TRIGGER_WORKLOAD_API_DOMAIN: supervisor
      TRIGGER_WORKLOAD_API_PORT_EXTERNAL: 8020
      ENFORCE_MACHINE_PRESETS: 1
      TRIGGER_DEQUEUE_INTERVAL_MS: 1000
      DOCKER_HOST: tcp://docker-proxy:2375
      DOCKER_RUNNER_NETWORKS: trigger-webapp,trigger-supervisor
      DOCKER_REGISTRY_URL: ${DOCKER_REGISTRY_URL}
      DOCKER_REGISTRY_USERNAME: registry-user
      DOCKER_REGISTRY_PASSWORD: ${DOCKER_REGISTRY_PASSWORD}
      DOCKER_AUTOREMOVE_EXITED_CONTAINERS: 1

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459
    restart: unless-stopped
    logging: *logging
    networks: [docker-proxy]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LOG_LEVEL: warning
      POST: 1
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1

volumes:
  clickhouse:
  minio:
  postgres:
  redis:
  registry:
  shared:

networks:
  docker-proxy:
    name: trigger-docker-proxy
  supervisor:
    name: trigger-supervisor
  webapp:
    name: trigger-webapp
