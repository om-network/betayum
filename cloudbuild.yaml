timeout: 3600s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8

substitutions:
  _ENVIRONMENT: staging
  _REGION: us-central1
  _ARTIFACT_REPOSITORY: betayum-staging
  _API_SERVICE: betayum-staging-api
  _APP_SERVICE: betayum-staging-app
  _PORTAL_SERVICE: betayum-staging-portal
  _MIGRATOR_JOB: betayum-staging-migrator
  _SEEDER_JOB: betayum-staging-seeder
  _API_URL: https://api.staging.betayum.com
  _APP_URL: https://app.staging.betayum.com
  _PORTAL_URL: https://portal.staging.betayum.com
  _AUTH_PRIMARY_DOMAIN: betayum.com
  _AUTH_STAGING_DOMAIN: staging.betayum.com
  _CLOUD_SQL_INSTANCE: centered-kiln-498405-h8:us-central1:betayum-db
  _APP_DATA_BUCKET: centered-kiln-498405-h8-betayum-staging-app-data
  _DEVICE_AGENT_ARTIFACTS_BUCKET: centered-kiln-498405-h8-betayum-staging-device-agent-artifacts

steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    waitFor:
      - '-'
    args:
      - build
      - -f
      - apps/api/Dockerfile.multistage
      - --target=production
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/api:$COMMIT_SHA
      - .

  - id: build-app
    name: gcr.io/cloud-builders/docker
    waitFor:
      - '-'
    args:
      - build
      - -f
      - Dockerfile
      - --target=app
      - --build-arg=NEXT_PUBLIC_BETTER_AUTH_URL=${_API_URL}
      - --build-arg=NEXT_PUBLIC_API_URL=${_API_URL}
      - --build-arg=NEXT_PUBLIC_PORTAL_URL=${_PORTAL_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/app:$COMMIT_SHA
      - .

  - id: build-portal
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-app
    args:
      - build
      - -f
      - Dockerfile
      - --target=portal
      - --build-arg=NEXT_PUBLIC_BETTER_AUTH_URL=${_API_URL}
      - --build-arg=NEXT_PUBLIC_API_URL=${_API_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/portal:$COMMIT_SHA
      - .

  - id: build-migrator
    name: gcr.io/cloud-builders/docker
    waitFor:
      - '-'
    args:
      - build
      - -f
      - Dockerfile
      - --target=migrator
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/migrator:$COMMIT_SHA
      - .

  - id: build-seeder
    name: gcr.io/cloud-builders/docker
    waitFor:
      - '-'
    args:
      - build
      - -f
      - Dockerfile
      - --target=seeder
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/seeder:$COMMIT_SHA
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-api
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/api:$COMMIT_SHA

  - id: push-app
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-app
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/app:$COMMIT_SHA

  - id: push-portal
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-portal
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/portal:$COMMIT_SHA

  - id: push-migrator
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-migrator
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/migrator:$COMMIT_SHA

  - id: push-seeder
    name: gcr.io/cloud-builders/docker
    waitFor:
      - build-seeder
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/seeder:$COMMIT_SHA

  - id: update-migrator-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    waitFor:
      - push-migrator
    args:
      - run
      - jobs
      - update
      - ${_MIGRATOR_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/migrator:$COMMIT_SHA
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --update-env-vars=BASE_URL=${_API_URL},AUTH_PRIMARY_DOMAIN=${_AUTH_PRIMARY_DOMAIN},AUTH_STAGING_DOMAIN=${_AUTH_STAGING_DOMAIN}
      - --update-secrets=DATABASE_URL=betayum-${_ENVIRONMENT}-database-url:latest
      - --quiet

  - id: update-seeder-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    waitFor:
      - push-seeder
    args:
      - run
      - jobs
      - update
      - ${_SEEDER_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/seeder:$COMMIT_SHA
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --update-env-vars=BASE_URL=${_API_URL},AUTH_PRIMARY_DOMAIN=${_AUTH_PRIMARY_DOMAIN},AUTH_STAGING_DOMAIN=${_AUTH_STAGING_DOMAIN}
      - --update-secrets=DATABASE_URL=betayum-${_ENVIRONMENT}-database-url:latest
      - --quiet

  - id: run-migrations
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    waitFor:
      - update-migrator-job
    args:
      - run
      - jobs
      - execute
      - ${_MIGRATOR_JOB}
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --wait
      - --quiet

  - id: run-seed
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    waitFor:
      - run-migrations
      - update-seeder-job
    args:
      - run
      - jobs
      - execute
      - ${_SEEDER_JOB}
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --wait
      - --quiet

  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    waitFor:
      - run-seed
      - push-api
    args:
      - run
      - deploy
      - ${_API_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/api:$COMMIT_SHA
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --platform=managed
      - --port=3333
      - --ingress=internal-and-cloud-load-balancing
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --update-env-vars=BASE_URL=${_API_URL},NEXT_PUBLIC_API_URL=${_API_URL},NEXT_PUBLIC_BETTER_AUTH_URL=${_API_URL},NEXT_PUBLIC_PORTAL_URL=${_PORTAL_URL},TRUST_APP_URL=${_PORTAL_URL},PORTAL_URL=${_PORTAL_URL},AUTH_PRIMARY_DOMAIN=${_AUTH_PRIMARY_DOMAIN},AUTH_STAGING_DOMAIN=${_AUTH_STAGING_DOMAIN},APP_OBJECT_STORAGE_BUCKET=${_APP_DATA_BUCKET},APP_DEVICE_AGENT_ARTIFACTS_BUCKET=${_DEVICE_AGENT_ARTIFACTS_BUCKET},APP_GCP_BUCKET_NAME=${_APP_DATA_BUCKET},APP_GCP_ENDPOINT=https://storage.googleapis.com,APP_GCP_REGION=auto,APP_GCP_ORG_ASSETS_BUCKET=${_APP_DATA_BUCKET}
      - --update-secrets=DATABASE_URL=betayum-${_ENVIRONMENT}-database-url:latest,SECRET_KEY=betayum-${_ENVIRONMENT}-secret-key:latest,AUTH_SECRET=betayum-${_ENVIRONMENT}-auth-secret:latest,RESEND_API_KEY=betayum-${_ENVIRONMENT}-resend-api-key:latest,UPSTASH_REDIS_REST_URL=betayum-${_ENVIRONMENT}-upstash-redis-rest-url:latest,UPSTASH_REDIS_REST_TOKEN=betayum-${_ENVIRONMENT}-upstash-redis-rest-token:latest,BETTER_AUTH_API_KEY=betayum-${_ENVIRONMENT}-better-auth-api-key:latest
      - --quiet

  - id: deploy-app
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    waitFor:
      - run-seed
      - push-app
    args:
      - run
      - deploy
      - ${_APP_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/app:$COMMIT_SHA
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --platform=managed
      - --port=3000
      - --ingress=internal-and-cloud-load-balancing
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --update-env-vars=NEXT_PUBLIC_API_URL=${_API_URL},NEXT_PUBLIC_BETTER_AUTH_URL=${_API_URL},NEXT_PUBLIC_PORTAL_URL=${_PORTAL_URL},APP_OBJECT_STORAGE_BUCKET=${_APP_DATA_BUCKET},APP_GCP_BUCKET_NAME=${_APP_DATA_BUCKET},APP_GCP_ENDPOINT=https://storage.googleapis.com,APP_GCP_REGION=auto,APP_GCP_QUESTIONNAIRE_UPLOAD_BUCKET=${_APP_DATA_BUCKET},APP_GCP_KNOWLEDGE_BASE_BUCKET=${_APP_DATA_BUCKET},APP_GCP_ORG_ASSETS_BUCKET=${_APP_DATA_BUCKET}
      - --remove-secrets=BETTER_AUTH_API_KEY
      - --update-secrets=DATABASE_URL=betayum-${_ENVIRONMENT}-database-url:latest,AUTH_SECRET=betayum-${_ENVIRONMENT}-auth-secret:latest,RESEND_API_KEY=betayum-${_ENVIRONMENT}-resend-api-key:latest,TRIGGER_SECRET_KEY=betayum-${_ENVIRONMENT}-trigger-secret-key:latest,REVALIDATION_SECRET=betayum-${_ENVIRONMENT}-revalidation-secret:latest
      - --quiet

  - id: deploy-portal
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    waitFor:
      - run-seed
      - push-portal
    args:
      - run
      - deploy
      - ${_PORTAL_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_ARTIFACT_REPOSITORY}/portal:$COMMIT_SHA
      - --region=${_REGION}
      - --project=$PROJECT_ID
      - --platform=managed
      - --port=3000
      - --ingress=internal-and-cloud-load-balancing
      - --add-cloudsql-instances=${_CLOUD_SQL_INSTANCE}
      - --update-env-vars=NEXT_PUBLIC_API_URL=${_API_URL},NEXT_PUBLIC_BETTER_AUTH_URL=${_API_URL},APP_OBJECT_STORAGE_BUCKET=${_APP_DATA_BUCKET},APP_DEVICE_AGENT_ARTIFACTS_BUCKET=${_DEVICE_AGENT_ARTIFACTS_BUCKET},APP_GCP_BUCKET_NAME=${_APP_DATA_BUCKET},APP_GCP_ENDPOINT=https://storage.googleapis.com,APP_GCP_REGION=auto,APP_GCP_ORG_ASSETS_BUCKET=${_APP_DATA_BUCKET},FLEET_AGENT_BUCKET_NAME=${_DEVICE_AGENT_ARTIFACTS_BUCKET}
      - --remove-secrets=BETTER_AUTH_API_KEY
      - --update-secrets=DATABASE_URL=betayum-${_ENVIRONMENT}-database-url:latest,BETTER_AUTH_SECRET=betayum-${_ENVIRONMENT}-better-auth-secret:latest,RESEND_API_KEY=betayum-${_ENVIRONMENT}-resend-api-key:latest
      - --quiet

  - id: smoke-api
    name: curlimages/curl:8.16.0
    entrypoint: sh
    waitFor:
      - deploy-api
      - deploy-app
      - deploy-portal
    args:
      - -c
      - curl --fail --retry 5 --retry-delay 10 "${_API_URL}/v1/health"

  - id: smoke-app
    name: curlimages/curl:8.16.0
    entrypoint: sh
    waitFor:
      - deploy-api
      - deploy-app
      - deploy-portal
    args:
      - -c
      - curl --fail --retry 5 --retry-delay 10 "${_APP_URL}/api/health"

  - id: smoke-portal
    name: curlimages/curl:8.16.0
    entrypoint: sh
    waitFor:
      - deploy-api
      - deploy-app
      - deploy-portal
    args:
      - -c
      - curl --fail --retry 5 --retry-delay 10 "${_PORTAL_URL}/"
